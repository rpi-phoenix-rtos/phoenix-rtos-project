# Time source for the boot-time clock sync.
#
# The Pi 4 has no RTC, so without a sync time() starts at the epoch: TLS
# rejects every certificate as "not yet valid" and files are stamped 1970.
# psh syncs once when an interactive session starts (see psh_clockSync), and
# `ntpclient` on its own reads this file too.
#
# One entry, `server=<host>`. '#' starts a comment. Change it to a host on your
# own network if this machine has no route to the internet; if the server cannot
# be reached the boot continues and ntpclient prints a warning.
server=pool.ntp.org
