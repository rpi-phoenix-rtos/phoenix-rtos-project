ports:
  - name: busybox
  # GNU bash 5.2.21: the interactive shell the release headline names. Runs fully
  # interactively over the console since the libphoenix select(NULL)-blocks fix.
  - name: bash
  - name: libnfs
  - name: zlib
  - name: lzo
  - name: pcre
  - name: jansson
  - name: lua
  - name: sqlite3
  - name: jq
  - name: redis
  # GNU coreutils 9.5: the full tool set (~105 programs) builds + installs. stat/sort
  # were recovered via libphoenix statfs/RLIMIT_* additions, factor/expr via bundled
  # mini-gmp, and stty once libphoenix gained the termios input-flag macros (2026-08-27).
  # Builds at -O2 (see port.def.sh: -O0 would disable gnulib's inline helpers and break
  # the link).
  - name: coreutils
  # Unwinding busybox: these replace the 15 names busybox uniquely supplied, with
  # the real GNU tools we can support alongside coreutils + bash. None of them
  # needs a `use:` -- grep is built --disable-perl-regexp so it does not want
  # PCRE2, tar invokes the compressors as external programs rather than linking
  # them, and sed/gzip/bzip2/xz are standalone. A port that nothing `depends=` on
  # ships nothing unless it is listed HERE.
  - name: grep
  - name: sed
  - name: tar
  - name: gzip
  - name: bzip2
  - name: xz
  - name: libevent
  - name: mbedtls
  - name: openssl
  # Trusted root CA store (Mozilla/NSS bundle, shipped as certifi's cacert.pem).
  # Installs /etc/ssl/certs/ca-certificates.crt + /etc/ssl/cert.pem, which is what
  # every TLS client we ship looks for by default: dillo's tls_mbedtls.c tries
  # /etc/ssl/certs/ca-certificates.crt FIRST, openssl is configured
  # --openssldir=/etc/ssl so its default CAfile is /etc/ssl/cert.pem (and python3's
  # ssl module inherits that), and curl is now built --with-ca-bundle pointing at
  # the same file. Nothing `depends=` on this port -- it ships data, not a library
  # -- so it MUST be listed here or it is never built.
  - name: ca_certificates
  - name: micropython
  - name: dropbear
    use: [zlib]
  - name: curl
    use: [mbedtls]
  - name: lighttpd
    use: [zlib]
  # The X11 client stack as framework ports: xorg_libs (~24 client/toolkit libs) ->
  # xorg_fonts (freetype/fontconfig/cairo/Xft/...), plus the xterm + windowmaker apps.
  # The X server is xorg_server_drm (the GPU stack, at the end of this file).
  - name: xorg_libs
    if: true
  - name: xorg_fonts
    if: true
  - name: xterm
    if: true
  - name: windowmaker
    if: true
  # Small core-X (Xaw/Xt) demo apps, migrated from tools/x11-port/build-{xcalc,
  # xclock,xlogo,xedit,xbill}.sh. xorg_apps is an aggregate of the four clean
  # autoconf apps; xbill is standalone (bespoke non-autoconf build) so its higher
  # breakage risk cannot block the aggregate. Both depend only on xorg_libs
  # (core-X clients, no Xft/fontconfig).
  - name: xorg_apps
    if: true
  - name: xbill
    if: true
  # dillo (FLTK/X11 web browser) — migrated to a framework port (depends="fltk
  # mbedtls libiconv"; fltk pulls xorg_libs+libpng+libjpeg+zlib). Registered
  # if:false like the rest; the image still gets Dillo from build-showcase-apps.sh
  # until the flip. NOTE: the whole ad-hoc X11 support stack (libpng, libjpeg,
  # fltk, libiconv, libffi, glib2, dillo) is now framework ports, so the `if:true`
  # flip is dependency-unblocked — the remaining work is the mechanical rewire
  # (flip these to if:true + drop the X11/glib2/fltk/dillo steps from
  # build-showcase-apps.sh) + a full showcase build + boot to prove it. glib2/
  # fltk/libpng/libjpeg/libiconv/libffi need no entry here — they are dependency
  # libraries pulled transitively via `depends=`.
  - name: dillo
    if: true
  # nano (GNU editor) + mc (Midnight Commander) — TUI apps migrated from the ad-hoc
  # tools/ports/build-{nano,mc}.sh scripts to framework ports. nano depends="ncurses";
  # mc depends="ncurses glib2 libiconv". ncurses needs no entry — it is a dependency
  # library pulled transitively via depends= (like glib2/fltk above).
  #
  # nano is now if:true and its showcase step is deleted in the same commit. Doing
  # only one of the two would either double-build it or stage two different
  # binaries, and the tools/ copy is written LAST (build-showcase-apps.sh --phase
  # stage runs after the ports stage into the same rootfs), so it would silently
  # win — which is precisely the trap that made a source fix in the port dir never
  # reach the shipped nano.
  #
  # Both are framework-only now, each flipped in lockstep with deleting its
  # build-showcase-apps.sh step. mc's Pi verification (2026-09-03) cleared the one
  # real risk from retiring its mc-support stub: its codeset moved from a forced
  # "UTF-8" to libphoenix's "ANSI_X3.4-1968", i.e. mc now takes the 8-bit
  # str_ascii_init() path -- and the full two-panel TUI renders correctly, because
  # ncurses draws the frame with VT100 ACS escapes rather than UTF-8 box glyphs.
  # Flipping mc also puts its whole chain (glib2, libiconv, ncurses, libffi, zlib)
  # on the framework path, which is what retires the tools/ "libiconv" that is not
  # libiconv at all but a hand-written ASCII/UTF-8 stub.
  - name: nano
    if: true
  - name: mc
    if: true
  # CPython 3.14.4 — a static `python3` interpreter (+ curated static C extension
  # modules) migrated from the ad-hoc tools/python-port/build.sh (deleted 2026-09-03,
  # once this port replaced it) to a framework
  # port (P8 tools/→ports). depends="zlib openssl sqlite3 libffi": those four pull
  # in the external libs for the zlib/_sqlite3/_ssl/_hashlib/_ctypes modules;
  # _decimal uses CPython's bundled libmpdec. The cross recipe (config.site ac_cv_*
  # cache, phoenix-py-compat.h -include shim, curated Setup.local, two configure
  # MACHDEP patches) is applied verbatim; a matching-version host python3 (3.14.x)
  # drives the freeze/sysconfig build steps. Registered if:false (the sdl2/nano/mc/
  # ffmpeg pre-flip precedent): build-proven via scripts/build-port.sh — a static
  # aarch64 python3 whose PyInit_* module set is byte-identical to the HW-verified
  # ad-hoc binary; installs non-stripped /bin/python3 (keeps .symtab for the dlopen
  # extension recipe) + the stdlib at /usr/local/lib/python3.14. No in-tree consumer
  # FLIPPED if:true 2026-09-03 (owner directive: "why are you hand copying old
  # binaries ... never do this"). /bin/python3 and the CPython stdlib were being
  # carried forward onto the NFS export by hand from an ad-hoc tools/python-port
  # (since deleted)
  # build, which hid the fact that no image ever produced them. The port installs
  # /bin/python3 plus the pure-Python stdlib at /usr/local/lib/python3.14 — which is
  # the prefix the interpreter itself was configured with, so it finds its own
  # stdlib with no PYTHONHOME. NOTE the previously hand-staged tree was
  # /lib/python3.14 (the ad-hoc build's layout); that path is NOT recreated and must
  # not be.
  - name: python
    if: true
  # wpa_supplicant 2.11 (+ wpa_cli) — the WPA2 supplicant the BCM43455 WiFi work
  # needs to associate. Registered 2026-09-03 for the same reason as python above:
  # /usr/bin/{wpa_supplicant,wpa_cli} were hand-copied onto the NFS export from a
  # standalone build, so no image contained them. depends="openssl>=1.1.1a".
  - name: wpa_supplicant
    if: true
  # ---------------------------------------------------------------------------
  # THE GPU STACK. Every entry is `use: [rootfs]`: without it such a port builds
  # into its own private prefix and ships nothing. Their
  # libraries (libdrm_phoenix, mesa_drm, sdl2_kmsdrm, wayland, wayland_phoenix,
  # libepoxy, libxshmfence_phoenix) come along as dependencies.
  #
  # The servers are core components (phoenix-rtos-devices), not ports.
  # ---------------------------------------------------------------------------
  # The GPU stack's self-tests ship only in a test build (RPI4B_WITH_TESTS=1, set by
  # scripts/rebuild-rpi4b-fast.sh --with-tests): drmprobe (the DRM API self-test,
  # libdrm_phoenix USE rootfs), kmscube (GBM/EGL/GLES on card0) and vkcube (v3dv +
  # VK_KHR_display). libdrm_phoenix itself is always built: everything below needs it.
  - name: libdrm_phoenix
    use: {{ ["rootfs"] if bool(env.RPI4B_WITH_TESTS) }}
  - name: kmscube_drm
    if: {{ bool(env.RPI4B_WITH_TESTS) }}
    use: [rootfs]
  - name: vkcube_drm
    if: {{ bool(env.RPI4B_WITH_TESTS) }}
    use: [rootfs]
  # The games: single static ELFs in the ROOTFS (never loader.disk), each on SDL2
  # KMSDRM + Mesa (GL/GLES; vkquake_drm on v3dv). /usr/bin/quakespasm, /usr/bin/quake2,
  # /usr/bin/quake3, /usr/bin/vkquake and /bin/stk (the launchers) run them. Each port's
  # engine patch is generated from our fork (external/<game>, branch phoenix-rpi4-port)
  # by scripts/game-port-patch.sh --regen. Game data (id1, baseq2, demoq3, STK data/ +
  # stk-assets/) is a runtime concern: scripts/stage-game-data.sh.
  # Each GL game is ONE program with SDL's KMSDRM and Wayland drivers: full screen from
  # psh, a window on the desktop through its XFCE menu entry (Games) =
  # /bin/game-window.sh <game> (sdl2_kmsdrm below). vkquake stays KMSDRM only (no V3DV
  # Wayland WSI).
  - name: quakespasm_drm
    use: [rootfs]
  - name: yquake2_drm
    use: [rootfs]
  - name: quake3_drm
    use: [rootfs]
  - name: vkquake_drm
    use: [rootfs]
  - name: supertuxkart_drm
    use: [rootfs]
  # SDL (KMSDRM + Wayland) itself is a library; USE rootfs installs the desktop's game
  # launcher /bin/game-window.sh <game>, game-window-autostart.sh, game-window-quit.sh and
  # /etc/xdg/labwc-xfce-games/ (the games session: `export CONF_DIR=/etc/xdg/labwc-xfce-games`
  # before /bin/xfce-session).
  - name: sdl2_kmsdrm
    use: [rootfs]
  # The X desktop: Xorg-drm (modesetting + glamor, DRI3/Present, phxhid input),
  # /bin/startx (the desktop launcher: action, wmaker, browse [url]) and the GL window
  # client eglx11-demo (x11demo). The X clients (xterm, wmaker, xclock, ...) are the
  # ports listed above.
  - name: xorg_server_drm
    use: [rootfs, x11demo]
  # The Wayland desktop: the session bus, GTK 3 (its schemas and settings), XFCE 4.20
  # (/bin/xfce-session, XFCE_AUTOSTART: /bin/xfce-autostart.sh) and labwc + foot + fuzzel +
  # swaybg (/bin/labwc-desktop.sh).
  - name: dbus
    use: [rootfs]
  - name: gtk3_wayland
    use: [rootfs]
  - name: xfce_wayland
    use: [rootfs]
  - name: labwc_desktop
    use: [rootfs]
  # The desktop applications (XFCE applications menu entries):
  # the video players: /usr/bin/ffplay (SDL KMSDRM + Wayland), /bin/video-play (a window
  # under the desktop, else full screen), /usr/bin/gtk-video (GTK 3, menu: Multimedia) and,
  # with USE demo, the clips in /usr/share/video-demo, the video session's labwc config
  # /etc/xdg/labwc-xfce-video/ and a "Video Demo" menu entry.
  - name: video_player
    use: [rootfs, gtk, demo]
  # The PDF viewer: Atril with Poppler built in, /usr/bin/atril (menu: Office), a sample
  # document /usr/share/doc/phoenix/sample.pdf.
  - name: atril_wayland
    use: [rootfs]
