ports:
  - name: busybox
  - name: libnfs
  - name: zlib
  - name: lzo
  - name: pcre
  - name: jansson
  - name: lua
  - name: sqlite3
  - name: jq
  - name: redis
  # GNU coreutils 9.5: 99/104 tools (the 5 skipped need libphoenix header/macro work
  # -- stat/sort/stty -- or GMP -- factor/expr). Builds at -O2 (see port.def.sh: -O0
  # would disable gnulib's inline helpers and break the link).
  - name: coreutils
  - name: coremark
  - name: picocom
  - name: libevent
  - name: mbedtls
  - name: openssl
  - name: micropython
  - name: dropbear
    use: [zlib]
  - name: curl
    use: [mbedtls]
  - name: lighttpd
    use: [zlib]
  # SDL2 (libSDL2.a: phoenix video+GL+input+audio drivers). Listed so the target
  # build knows the port, but gated off (if: false) for now: no in-tree consumer
  # exists yet and SDL2 is not proven in a full image build, so an unconditional
  # build would add cost + a break-point to every image build. The port stays
  # discoverable via its port.def.sh, so a future game port (Quake2/3/STK) that
  # declares `use: [sdl2]` / `depends` still pulls it in on demand. Flip to
  # `if: true` (or drop the gate) once a consumer lands and it is image-proven.
  # Standalone build/verify meanwhile: scripts/build-sdl2-port.sh.
  - name: sdl2
    if: false
  # X11 stack, migrated to the real port_manager framework as three aggregate
  # ports (hybrid layer grouping, owner E4): xorg_libs (L1, ~24 client/toolkit
  # libs) -> xorg_fonts (L2, freetype/fontconfig/cairo/Xft/...) -> xorg_server
  # (L3, the kdrive fbdev-DDX Xphoenix binary), plus the xterm + windowmaker
  # apps. All five BUILD CLEAN and resolve together (cross-root depend dedup).
  # Gated `if: false` like sdl2: build-proven + discoverable + dependency-
  # pullable, but the stack fetches ~30 upstream tarballs (~5 min cold), so
  # gating avoids adding that cost + a break-point to every image build until a
  # consumer/showcase wiring consumes them. Today the shipped X11 apps still come
  # from scripts/build-showcase-apps.sh; migrating that path onto these ports (and
  # flipping to `if: true`) is the follow-up. Dependency-ordered for readability
  # (the resolver orders by `depends`, so listing order is cosmetic).
  - name: xorg_libs
    if: false
  - name: xorg_fonts
    if: false
  - name: xorg_server
    if: false
  - name: xterm
    if: false
  - name: windowmaker
    if: false
