ports:
  - name: busybox
  # GNU bash 5.2.21: the interactive shell the release headline names. Runs fully
  # interactively over the console since the libphoenix select(NULL)-blocks fix.
  - name: bash
  - name: libnfs
  - name: zlib
  - name: lzo
  - name: pcre
  - name: jansson
  - name: lua
  - name: sqlite3
  - name: jq
  - name: redis
  # GNU coreutils 9.5: the full tool set (~105 programs) builds + installs. stat/sort
  # were recovered via libphoenix statfs/RLIMIT_* additions, factor/expr via bundled
  # mini-gmp, and stty once libphoenix gained the termios input-flag macros (2026-08-27).
  # Builds at -O2 (see port.def.sh: -O0 would disable gnulib's inline helpers and break
  # the link).
  - name: coreutils
  - name: coremark
  - name: picocom
  - name: libevent
  - name: mbedtls
  - name: openssl
  - name: micropython
  - name: dropbear
    use: [zlib]
  - name: curl
    use: [mbedtls]
  - name: lighttpd
    use: [zlib]
  # SDL2 (libSDL2.a: phoenix video+GL+input+audio drivers). Listed so the target
  # build knows the port, but gated off (if: false) for now: no in-tree consumer
  # exists yet and SDL2 is not proven in a full image build, so an unconditional
  # build would add cost + a break-point to every image build. The port stays
  # discoverable via its port.def.sh, so a future game port (Quake2/3/STK) that
  # declares `use: [sdl2]` / `depends` still pulls it in on demand. Flip to
  # `if: true` (or drop the gate) once a consumer lands and it is image-proven.
  # Standalone build/verify meanwhile: scripts/build-sdl2-port.sh.
  - name: sdl2
    if: false
  # X11 stack, migrated to the real port_manager framework as three aggregate
  # ports (hybrid layer grouping, owner E4): xorg_libs (L1, ~24 client/toolkit
  # libs) -> xorg_fonts (L2, freetype/fontconfig/cairo/Xft/...) -> xorg_server
  # (L3, the kdrive fbdev-DDX Xphoenix binary), plus the xterm + windowmaker
  # apps. All five BUILD CLEAN and resolve together (cross-root depend dedup).
  # Gated `if: false` like sdl2: build-proven + discoverable + dependency-
  # pullable, but the stack fetches ~30 upstream tarballs (~5 min cold), so
  # gating avoids adding that cost + a break-point to every image build until a
  # consumer/showcase wiring consumes them. Today the shipped X11 apps still come
  # from scripts/build-showcase-apps.sh (ad-hoc tools/x11-port scripts).
  #
  # Follow-up (flip to `if: true`) is validated but deliberately GATED, not blocked:
  #   * scripts/build-xorg-ports.sh drives port_manager on exactly these five ports
  #     standalone (the sdl2 precedent) and rebuilds them clean in ~45 s warm — the
  #     mechanism a future `if: true` build would use, re-verified 2026-08-21.
  #   * The framework stack is SELF-CONTAINED (pulls only the framework `zlib`; no
  #     dependency on the ad-hoc /tmp/x11-phoenix prefix), so xorg CAN flip safely.
  #   * BUT the ad-hoc build-showcase-apps.sh X11 step ALSO seeds /tmp/x11-phoenix
  #     with zlib/png/jpeg that the still-ad-hoc glib2/fltk/dillo (E4-deferred)
  #     consume. So the ad-hoc X11 cannot be REMOVED until those migrate; flipping
  #     `if: true` alone would build X11 twice (framework + ad-hoc) and stage two
  #     Xphoenix binaries. The clean flip is therefore atomic with the glib2/fltk/
  #     dillo migration (E4) — do both together, not `if: true` in isolation.
  # Dependency-ordered for readability (the resolver orders by `depends`, so listing
  # order is cosmetic).
  # FLIPPED if:true 2026-08-22 (#7 X11 migration): the whole X11 support stack is
  # now framework ports and staging into the image rootfs is verified (xorg_server
  # b_install -> _fs/root/usr/bin/Xphoenix, xterm/windowmaker -> _fs/root/bin). The
  # ad-hoc build-showcase-apps.sh X11 steps that overlap these are being removed in
  # lockstep. The small Xaw demo apps are now framework ports too: xorg_apps
  # (xcalc/xclock/xlogo/xedit) + the standalone xbill port. Only xlaunch (the tiny
  # in-repo startx supervisor, not an upstream tarball) remains ad-hoc.
  - name: xorg_libs
    if: true
  - name: xorg_fonts
    if: true
  - name: xorg_server
    if: true
  - name: xterm
    if: true
  - name: windowmaker
    if: true
  # Small core-X (Xaw/Xt) demo apps, migrated from tools/x11-port/build-{xcalc,
  # xclock,xlogo,xedit,xbill}.sh. xorg_apps is an aggregate of the four clean
  # autoconf apps; xbill is standalone (bespoke non-autoconf build) so its higher
  # breakage risk cannot block the aggregate. Both depend only on xorg_libs
  # (core-X clients, no Xft/fontconfig).
  - name: xorg_apps
    if: true
  - name: xbill
    if: true
  # dillo (FLTK/X11 web browser) — migrated to a framework port (depends="fltk
  # mbedtls libiconv"; fltk pulls xorg_libs+libpng+libjpeg+zlib). Registered
  # if:false like the rest; the image still gets Dillo from build-showcase-apps.sh
  # until the flip. NOTE: the whole ad-hoc X11 support stack (libpng, libjpeg,
  # fltk, libiconv, libffi, glib2, dillo) is now framework ports, so the `if:true`
  # flip is dependency-unblocked — the remaining work is the mechanical rewire
  # (flip these to if:true + drop the X11/glib2/fltk/dillo steps from
  # build-showcase-apps.sh) + a full showcase build + boot to prove it. glib2/
  # fltk/libpng/libjpeg/libiconv/libffi need no entry here — they are dependency
  # libraries pulled transitively via `depends=`.
  - name: dillo
    if: true
  # nano (GNU editor) + mc (Midnight Commander) — TUI apps migrated from the ad-hoc
  # tools/ports/build-{nano,mc}.sh scripts to framework ports. nano depends="ncurses";
  # mc depends="ncurses glib2 libiconv". ncurses needs no entry — it is a dependency
  # library pulled transitively via depends= (like glib2/fltk above).
  #
  # nano is now if:true and its showcase step is deleted in the same commit. Doing
  # only one of the two would either double-build it or stage two different
  # binaries, and the tools/ copy is written LAST (build-showcase-apps.sh --phase
  # stage runs after the ports stage into the same rootfs), so it would silently
  # win — which is precisely the trap that made a source fix in the port dir never
  # reach the shipped nano.
  #
  # mc stays if:false for now: its chain (glib2, libiconv, ncurses) still has
  # legacy tools/ steps, and the framework mc needs its own Pi verification after
  # the mc-support stub retirement changed its codeset path. One port at a time.
  - name: nano
    if: true
  - name: mc
    if: false
  # ffmpeg decode core (static libav{util,codec,format}.a + libsw{scale,resample}.a,
  # decode-only LGPL-2.1 config: no --enable-gpl/--nonfree) — migrated from the ad-hoc
  # tools/ffmpeg-port/build-ffmpeg-phoenix.py to a framework port (P8 tools/→ports).
  # Registered if:false (the sdl2/nano/mc pre-flip precedent): build-proven via
  # scripts/build-port.sh (all libav*/libsw* archives + headers install to
  # PREFIX_A/PREFIX_H, 0 errors) and discoverable/dependency-pullable, but no in-tree
  # consumer wires it yet — the E4 decode demos/players (e4_decode_file.c, e4_play.c)
  # stay in tools/ffmpeg-port. Flip to if:true once a consumer lands and it is image-proven.
  - name: ffmpeg
    if: false
  # CPython 3.14.4 — a static `python3` interpreter (+ curated static C extension
  # modules) migrated from the ad-hoc tools/python-port/build.sh to a framework
  # port (P8 tools/→ports). depends="zlib openssl sqlite3 libffi": those four pull
  # in the external libs for the zlib/_sqlite3/_ssl/_hashlib/_ctypes modules;
  # _decimal uses CPython's bundled libmpdec. The cross recipe (config.site ac_cv_*
  # cache, phoenix-py-compat.h -include shim, curated Setup.local, two configure
  # MACHDEP patches) is applied verbatim; a matching-version host python3 (3.14.x)
  # drives the freeze/sysconfig build steps. Registered if:false (the sdl2/nano/mc/
  # ffmpeg pre-flip precedent): build-proven via scripts/build-port.sh — a static
  # aarch64 python3 whose PyInit_* module set is byte-identical to the HW-verified
  # ad-hoc binary; installs non-stripped /bin/python3 (keeps .symtab for the dlopen
  # extension recipe) + the stdlib at /usr/local/lib/python3.14. No in-tree consumer
  # FLIPPED if:true 2026-09-03 (owner directive: "why are you hand copying old
  # binaries ... never do this"). /bin/python3 and the CPython stdlib were being
  # carried forward onto the NFS export by hand from an ad-hoc tools/python-port
  # build, which hid the fact that no image ever produced them. The port installs
  # /bin/python3 plus the pure-Python stdlib at /usr/local/lib/python3.14 — which is
  # the prefix the interpreter itself was configured with, so it finds its own
  # stdlib with no PYTHONHOME. NOTE the previously hand-staged tree was
  # /lib/python3.14 (the ad-hoc build's layout); that path is NOT recreated and must
  # not be.
  - name: python
    if: true
  # wpa_supplicant 2.11 (+ wpa_cli) — the WPA2 supplicant the BCM43455 WiFi work
  # needs to associate. Registered 2026-09-03 for the same reason as python above:
  # /usr/bin/{wpa_supplicant,wpa_cli} were hand-copied onto the NFS export from a
  # standalone build, so no image contained them. depends="openssl>=1.1.1a".
  - name: wpa_supplicant
    if: true
  # ---------------------------------------------------------------------------
  # GAME ENGINES (owner priority 2026-09-03: ONE image that carries EVERY game).
  #
  # All five engines are `if: true` and install into the ROOTFS (/usr/bin/...) —
  # NOT into loader.disk. The boot blob carries only plo + the kernel + the
  # servers/drivers the boot sequence needs; a game is an ordinary rootfs binary
  # started from psh. The old arrangement bundled the ~18 MB GLQuake ELF into
  # loader.disk because "it is too large to exec from the read-based ext2/NFS
  # loader" — that limitation is GONE (the loader was fixed long ago; large
  # binaries exec fine from both the ext2 root and the NFS root), and with it the
  # "loader.disk fits only one large GL/VK binary, so GLQuake and vkQuake swap"
  # constraint. Every game now ships in every image, for both the `sd` and the
  # `nfsroot`/`netboot` variants.
  #
  # This is decision D10 ("one way to build each game; no parts of the patches
  # lost"): the fork (external/<game>, branch phoenix-rpi4-port) is the single
  # source of truth, each port's patch is GENERATED from it by
  # scripts/game-port-patch.sh --regen, and the ad-hoc build paths these ports
  # replaced are removed in the same change — so there is exactly one recipe per
  # game and no second representation to drift.
  #
  # SHARED PREREQUISITE (deliberately accepted, tracked as a wart): the Mesa/V3D
  # GPU stack is not yet a framework port, so each recipe links
  # tools/.gpu-libs/lib{GL,v3d,v3dv}-phoenix.a and Mesa headers by absolute path
  # and b_die's if they are absent. A ports stage therefore now REQUIRES a prior
  # GPU-libs build (scripts/build-showcase-apps.sh --phase gpu, i.e. the
  # --with-showcase rebuild path). Portifying the GL stack removes this from all
  # five at once.
  #
  # GAME DATA is a separate RUNTIME concern, staged into the rootfs overlay by
  # scripts/stage-game-data.sh (id1/pak0.pak, baseq2, demoq3, SuperTuxKart
  # data/ + stk-assets/). Launchers that wire the env/args each engine needs are
  # built by scripts/build-rootfs-helpers.sh.
  # ---------------------------------------------------------------------------
  # QuakeSpasm (Quake I engine) — a single static aarch64 ELF on the ported SDL2 +
  # Mesa/V3D GL stack, installed as /usr/bin/quakespasm. depends="sdl2" (the stock
  # gl_vidsdl/in_sdl/snd_sdl backends link the ported libSDL2.a); a small Phoenix
  # backend (glue/pl_phoenix_{sys,main,stubs}) replaces main_sdl/sys_sdl_unix/
  # pl_linux/net_bsd. Replaces the ad-hoc tools/quakespasm-port
  # build-quakespasm-sdl-phoenix.py recipe AND the _user/rpi4-quake loader.disk
  # wrapper, both removed in the same change. The id1 game data (pak0.pak ...) is
  # staged under /usr/share/quake/id1.
  - name: quakespasm
    if: true
  # yQuake2 (Quake II engine) — a single static aarch64 ELF on the ported SDL2 +
  # Mesa/V3D GL stack, installed as /usr/bin/yquake2. depends="sdl2"; Phoenix has no
  # dlopen, so the game-DLL + renderer-DLL seams are folded into one binary (client
  # + integrated server + baseq2 game + renderer + a Phoenix backend). The renderer
  # defaults to **gl3/GLES3** — the configuration that has actually rendered on V3D
  # 4.2, with glGenerateMipmap off by default (YQ2_GL3_MIPMAP=1 re-enables it);
  # YQ2_RENDERER=gl1 selects the untested OpenGL-1 renderer instead. The baseq2
  # game data is staged under /usr/share/quake2.
  - name: yquake2
    if: true
  # quake3e (Quake III Arena engine, opengl1 renderer) — a single static aarch64 ELF
  # on the ported SDL2 + Mesa/V3D GL stack, installed as /usr/bin/quake3e.
  # depends="sdl2"; the game/cgame/ui modules are interpreted QVM bytecode shipped in
  # the pak (data, not C), so there is no game-DLL fold — client + integrated server +
  # botlib + opengl1 renderer + bundled libjpeg + the aarch64 QVM JIT link into one
  # binary. NOTE: quake3e's *Vulkan* renderer (renderervk) is NOT built here; only the
  # OpenGL one is wired. The demoq3 game data (pk3s) is staged under /usr/share/quake3.
  - name: quake3
    if: true
  # vkQuake (Vulkan Quake I engine) — installed as /usr/bin/vkquake. Unlike the GL
  # game ports it renders via VULKAN, so it links libv3dv-phoenix.a +
  # libv3d-phoenix.a (NOT libGL-phoenix.a) and has depends="" (its SDL usage is
  # shimmed entirely — no libSDL2.a). Its link carries --build-id (V3DV's
  # init_uuids() needs the note or no Vulkan device is created) and
  # -z stack-size=32 MiB, matching the HW-verified _user/rpi4-vkquake link this
  # replaces. Shares the id1 data with quakespasm (/usr/share/quake/id1).
  - name: vkquake
    if: true
  # SuperTuxKart 1.4 (3D kart racing, SP/GLES3 renderer) — installed as
  # /usr/bin/supertuxkart. Its recipe is a pinned upstream tarball (stk-code 1.4)
  # plus 10 flat portability patches; every dependency that is not bundled in
  # stk-code/lib is a framework port and is pulled via depends= (sdl2 libjpeg libpng
  # zlib xorg_fonts curl mbedtls sqlite3 libogg libvorbis libsamplerate harfbuzz).
  # It was previously build-verified only standalone via scripts/build-port.sh and
  # was NOT registered here at all, so no image build ever produced it — hence the
  # "SuperTuxKart is not on the card" claim. It is registered now. STK needs BOTH
  # asset roots at runtime (data/ from the pinned tarball, stk-assets/ from the
  # pinned 1.4 asset archive) under /usr/share/supertuxkart — see
  # scripts/stage-game-data.sh — plus the /bin/stk launcher (psh cannot set env
  # vars, and STK locates its data through SUPERTUXKART_{DATADIR,ASSETS_DIR,SAVEDIR}).
  - name: supertuxkart
    if: true
