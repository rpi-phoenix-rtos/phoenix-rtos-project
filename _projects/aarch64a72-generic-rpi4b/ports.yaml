ports:
  - name: busybox
  # GNU bash 5.2.21: the interactive shell the release headline names. Runs fully
  # interactively over the console since the libphoenix select(NULL)-blocks fix.
  - name: bash
  - name: libnfs
  - name: zlib
  - name: lzo
  - name: pcre
  - name: jansson
  - name: lua
  - name: sqlite3
  - name: jq
  - name: redis
  # GNU coreutils 9.5: 99/104 tools (the 5 skipped need libphoenix header/macro work
  # -- stat/sort/stty -- or GMP -- factor/expr). Builds at -O2 (see port.def.sh: -O0
  # would disable gnulib's inline helpers and break the link).
  - name: coreutils
  - name: coremark
  - name: picocom
  - name: libevent
  - name: mbedtls
  - name: openssl
  - name: micropython
  - name: dropbear
    use: [zlib]
  - name: curl
    use: [mbedtls]
  - name: lighttpd
    use: [zlib]
  # SDL2 (libSDL2.a: phoenix video+GL+input+audio drivers). Listed so the target
  # build knows the port, but gated off (if: false) for now: no in-tree consumer
  # exists yet and SDL2 is not proven in a full image build, so an unconditional
  # build would add cost + a break-point to every image build. The port stays
  # discoverable via its port.def.sh, so a future game port (Quake2/3/STK) that
  # declares `use: [sdl2]` / `depends` still pulls it in on demand. Flip to
  # `if: true` (or drop the gate) once a consumer lands and it is image-proven.
  # Standalone build/verify meanwhile: scripts/build-sdl2-port.sh.
  - name: sdl2
    if: false
  # X11 stack, migrated to the real port_manager framework as three aggregate
  # ports (hybrid layer grouping, owner E4): xorg_libs (L1, ~24 client/toolkit
  # libs) -> xorg_fonts (L2, freetype/fontconfig/cairo/Xft/...) -> xorg_server
  # (L3, the kdrive fbdev-DDX Xphoenix binary), plus the xterm + windowmaker
  # apps. All five BUILD CLEAN and resolve together (cross-root depend dedup).
  # Gated `if: false` like sdl2: build-proven + discoverable + dependency-
  # pullable, but the stack fetches ~30 upstream tarballs (~5 min cold), so
  # gating avoids adding that cost + a break-point to every image build until a
  # consumer/showcase wiring consumes them. Today the shipped X11 apps still come
  # from scripts/build-showcase-apps.sh (ad-hoc tools/x11-port scripts).
  #
  # Follow-up (flip to `if: true`) is validated but deliberately GATED, not blocked:
  #   * scripts/build-xorg-ports.sh drives port_manager on exactly these five ports
  #     standalone (the sdl2 precedent) and rebuilds them clean in ~45 s warm — the
  #     mechanism a future `if: true` build would use, re-verified 2026-08-21.
  #   * The framework stack is SELF-CONTAINED (pulls only the framework `zlib`; no
  #     dependency on the ad-hoc /tmp/x11-phoenix prefix), so xorg CAN flip safely.
  #   * BUT the ad-hoc build-showcase-apps.sh X11 step ALSO seeds /tmp/x11-phoenix
  #     with zlib/png/jpeg that the still-ad-hoc glib2/fltk/dillo (E4-deferred)
  #     consume. So the ad-hoc X11 cannot be REMOVED until those migrate; flipping
  #     `if: true` alone would build X11 twice (framework + ad-hoc) and stage two
  #     Xphoenix binaries. The clean flip is therefore atomic with the glib2/fltk/
  #     dillo migration (E4) — do both together, not `if: true` in isolation.
  # Dependency-ordered for readability (the resolver orders by `depends`, so listing
  # order is cosmetic).
  # FLIPPED if:true 2026-08-22 (#7 X11 migration): the whole X11 support stack is
  # now framework ports and staging into the image rootfs is verified (xorg_server
  # b_install -> _fs/root/usr/bin/Xphoenix, xterm/windowmaker -> _fs/root/bin). The
  # ad-hoc build-showcase-apps.sh X11 steps that overlap these are being removed in
  # lockstep. The small Xaw demo apps are now framework ports too: xorg_apps
  # (xcalc/xclock/xlogo/xedit) + the standalone xbill port. Only xlaunch (the tiny
  # in-repo startx supervisor, not an upstream tarball) remains ad-hoc.
  - name: xorg_libs
    if: true
  - name: xorg_fonts
    if: true
  - name: xorg_server
    if: true
  - name: xterm
    if: true
  - name: windowmaker
    if: true
  # Small core-X (Xaw/Xt) demo apps, migrated from tools/x11-port/build-{xcalc,
  # xclock,xlogo,xedit,xbill}.sh. xorg_apps is an aggregate of the four clean
  # autoconf apps; xbill is standalone (bespoke non-autoconf build) so its higher
  # breakage risk cannot block the aggregate. Both depend only on xorg_libs
  # (core-X clients, no Xft/fontconfig).
  - name: xorg_apps
    if: true
  - name: xbill
    if: true
  # dillo (FLTK/X11 web browser) — migrated to a framework port (depends="fltk
  # mbedtls libiconv"; fltk pulls xorg_libs+libpng+libjpeg+zlib). Registered
  # if:false like the rest; the image still gets Dillo from build-showcase-apps.sh
  # until the flip. NOTE: the whole ad-hoc X11 support stack (libpng, libjpeg,
  # fltk, libiconv, libffi, glib2, dillo) is now framework ports, so the `if:true`
  # flip is dependency-unblocked — the remaining work is the mechanical rewire
  # (flip these to if:true + drop the X11/glib2/fltk/dillo steps from
  # build-showcase-apps.sh) + a full showcase build + boot to prove it. glib2/
  # fltk/libpng/libjpeg/libiconv/libffi need no entry here — they are dependency
  # libraries pulled transitively via `depends=`.
  - name: dillo
    if: true
  # nano (GNU editor) + mc (Midnight Commander) — TUI apps migrated from the ad-hoc
  # tools/ports/build-{nano,mc}.sh scripts to framework ports. nano depends="ncurses";
  # mc depends="ncurses glib2 libiconv". ncurses needs no entry — it is a dependency
  # library pulled transitively via depends= (like glib2/fltk above). Registered
  # if:false (the pre-flip sdl2 precedent): build-proven via scripts/build-port.sh
  # (/bin/nano 500 KiB + /bin/mc 2.4 MiB, both static aarch64, 0 undefined) and
  # discoverable, but the image still gets nano/mc from build-showcase-apps.sh until
  # those ad-hoc steps are dropped in lockstep with the if:true flip (avoids a
  # double-build / two staged binaries).
  - name: nano
    if: false
  - name: mc
    if: false
