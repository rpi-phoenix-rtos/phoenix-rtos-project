ports:
  - name: busybox
  - name: libnfs
  - name: zlib
  - name: lzo
  - name: pcre
  - name: jansson
  - name: lua
  - name: sqlite3
  - name: jq
  - name: redis
  # GNU coreutils (9.5): 99/104 tools cross-compile+link cleanly against libphoenix
  # (verified by a direct cross-build). Gated off pending one framework-build fix:
  # gnulib's _GL_EXTERN_INLINE resolves to `static` under the framework sysroot, so
  # mbszero (an extern-inline) links undefined. The port.def.sh + config.site + both
  # patches are complete; flip to `if: true` once that inline-mode issue is resolved.
  - name: coreutils
    if: false
  - name: coremark
  - name: picocom
  - name: libevent
  - name: mbedtls
  - name: openssl
  - name: micropython
  - name: dropbear
    use: [zlib]
  - name: curl
    use: [mbedtls]
  - name: lighttpd
    use: [zlib]
  # SDL2 (libSDL2.a: phoenix video+GL+input+audio drivers). Listed so the target
  # build knows the port, but gated off (if: false) for now: no in-tree consumer
  # exists yet and SDL2 is not proven in a full image build, so an unconditional
  # build would add cost + a break-point to every image build. The port stays
  # discoverable via its port.def.sh, so a future game port (Quake2/3/STK) that
  # declares `use: [sdl2]` / `depends` still pulls it in on demand. Flip to
  # `if: true` (or drop the gate) once a consumer lands and it is image-proven.
  # Standalone build/verify meanwhile: scripts/build-sdl2-port.sh.
  - name: sdl2
    if: false
